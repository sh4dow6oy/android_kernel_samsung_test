name: Samsung SM8150 r5q Kernel Build

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 # Configurat pe Ubuntu 22.04 pentru compatibilitate maximă nativă

    steps:
      - name: "Set up build environment"
        run: |
          sudo apt-get update
          
          # Pe Ubuntu 22.04 toate aceste pachete (inclusiv ncurses5 și python2.7) se instalează nativ fără erori!
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev make libncurses5-dev git curl clang lld \
            libelf-dev erofs-utils android-sdk-libsparse-utils automake autoconf libtool pkg-config fuse3 e2fsprogs pv liblz4-dev uuid-dev \
            libfuse3-dev f2fs-tools fuse2fs attr zlib1g-dev rsync \
            device-tree-compiler lz4 xz-utils openjdk-17-jdk gcc g++ python2.7 p7zip-full \
            cpio zip unzip kmod tar openssl python3-pip

          # Forțăm comanda globală 'python' să folosească Python 2.7 pentru scripturile Qualcomm din kernel
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2

      - name: "Import kernel source"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Descarcă tot istoricul pentru ca cherry-pick să funcționeze corect

      - name: "Setting permission"
        run: chmod +x build.sh

      # Compilăm DTC-ul modern ÎNAINTE ca scriptul build.sh să pornească
      - name: "Build New DTC"
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/utils/dtc/dtc.git
          cd dtc
          make -j$(nproc)
          echo "$(pwd)" >> $GITHUB_PATH

      - name: "Build for specific device"
        run: ./build.sh
        
      - name: "Package with AnyKernel3"
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          rm -rf AnyKernel/.git
          
          # Căutăm doar imaginea principală de Kernel
          NEW_IMAGE=$(find . -name "Image.gz-dtb" -path "*/arch/arm64/boot/Image.gz-dtb" | head -n 1)
          
          # CORECTAT: Verificăm strict doar dacă imaginea există, ignorând complet DTBO
          if [ -z "$NEW_IMAGE" ]; then
            echo "EROARE CRITICĂ: Lipsește fișierul Image.gz-dtb!"
            exit 1
          fi
          
          # Copiem kernelul în AnyKernel3
          cp "$NEW_IMAGE" AnyKernel/Image.gz-dtb
          
          # Generăm și copiem modulele dacă ele există
          mkdir -p AnyKernel/modules
          find . -name "*.ko" -not -path "./AnyKernel/*" -exec cp {} AnyKernel/modules/ \;
          
          # Dezactivăm verificarea de dispozitiv pentru compatibilitate în TWRP
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel/anykernel.sh
          
          # Împachetăm arhiva finală flash-abilă
          cd AnyKernel
          zip -r9 ../Kernel-r5q-AnyKernel-Flashable.zip *
          cd ..

      - name: "Upload Flashable Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-SM8150-Final-Kernel
          path: Kernel-r5q-AnyKernel-Flashable.zip # CORECTAT: Scoatem dtbo.img de la upload ca să nu dea eroare
